name: LAWRENCE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:lawrence_dev_password@localhost:5432/lawrence
  PAYLOAD_SECRET: ci_secret_change_me_in_production_min_32_chars
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  TYPESENSE_HOST: localhost
  TYPESENSE_PORT: 8108
  TYPESENSE_PROTOCOL: http
  TYPESENSE_API_KEY: devkey
  TYPESENSE_SEARCH_ONLY_KEY: devkey_search

jobs:
  quality-gate:
    name: Typecheck, Lint, Unit Tests, Build & Bundle Budget
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lawrence_dev_password
          POSTGRES_DB: lawrence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lawrence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /data
          TYPESENSE_API_KEY: devkey
          TYPESENSE_ENABLE_CORS: true
        ports:
          - 8108:8108
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (§16.1 — blocking on high/critical in prod deps)
        run: pnpm audit --prod --audit-level=high

      - name: Enable Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Generate Payload types
        run: pnpm payload:generate:types

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Vitest unit & integration tests
        run: pnpm test

      - name: Build and check bundle budget
        run: pnpm bundle:budget

  e2e:
    name: Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lawrence_dev_password
          POSTGRES_DB: lawrence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lawrence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /data
          TYPESENSE_API_KEY: devkey
          TYPESENSE_ENABLE_CORS: true
        ports:
          - 8108:8108
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          WL_DB_E2E: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality-gate
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lawrence_dev_password
          POSTGRES_DB: lawrence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lawrence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_DATA_DIR: /data
          TYPESENSE_API_KEY: devkey
          TYPESENSE_ENABLE_CORS: true
        ports:
          - 8108:8108
        options: >-
          --health-cmd "curl -f http://localhost:8108/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable Postgres extensions
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
