version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lawrence-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lawrence_dev_password
      POSTGRES_DB: lawrence
    ports:
      - '5432:5432'
    volumes:
      - lawrence_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lawrence']
      interval: 5s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    container_name: lawrence-typesense
    restart: always
    command: '--data-dir /data --api-key=devkey --enable-cors'
    ports:
      - '8108:8108'
    volumes:
      - lawrence_tsdata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8108/health']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lawrence_pgdata:
  lawrence_tsdata:
